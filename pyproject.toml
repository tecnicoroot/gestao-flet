[project]
name = "gestao-flet"
version = "0.1.0"
description = "Sistema de gestão em Flet com arquitetura em camadas."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet==1.0.1",
    "sqlalchemy>=2.1",
    "alembic>=1.14",
    "python-dotenv>=1.0.1",
    "pydantic[email]>=2.9",
    "argon2-cffi>=23.1",    
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]

[project.scripts]
gestao = 'app.__main__:main'
gestao-cli = 'app.cli:main'

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

#----------- ruff config -----------
[tool.ruff]
line-length = 100  
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
    ".venv",
    "build",
    "dist",
    ".eggs",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".git",
    "migrations/versions",
]

[tool.ruff.lint]
select = [
    "E", "W",  # All errors
    "F", "I", "N", "UP", "B", "S", "SIM", "C4", "DTZ", "RUF", "PL", "PT"
]

ignore = ["PLR0913", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [ "S101", "S105", "S106", "S107", "PLR2004"]
"migrations/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"

#----------- mypy config -----------
[tool.mypy]
python_version = 3.12
mypy_path = ["src"]
packages = ["app"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["app.ui.*"]
disallow_untyped_defs = false

#----------- pytest config  -----------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"

markers = [
  
    "integration: testes que usam banco/migrações reais.",
   
]

[tool.coverage.run]
branch = true
omit = [
    "src/app/ui/*",
    "src/app/__main__.py",
    "src/app/cli.py",
]

